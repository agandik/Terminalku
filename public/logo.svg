<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminalku">
  <!--
    Geometri diekstrak dari mockup referensi (analisis piksel), bukan perkiraan manual.
    Grid kerja 1024×1024; tile 679×679 di offset 173.

    CATATAN PENTING soal tema:
    File ini dipakai sebagai <img>/favicon, jadi ia dokumen terpisah dari halaman —
    selector [data-theme] milik app TIDAK sampai ke sini. Yang bisa jalan hanya
    prefers-color-scheme (ikut OS). Untuk logo yang ikut tombol toggle di app,
    pakai komponen inline src/components/Logo.tsx.
  -->
  <style>
    .tile { fill: #2b2b2b; }
    .slate { fill: #4b545f; }
    .green { fill: #28ba70; }

    @media (prefers-color-scheme: light) {
      .tile { fill: #f1f5f9; }
      .slate { fill: #334155; }
      .green { fill: #059669; }
    }
  </style>

  <rect class="tile" x="173" y="173" width="679" height="679" rx="150" />

  <!-- Palang atas kiri: corong yang menyempit ke bawah -->
  <path class="slate" d="M314 298 H558 L452 392 H374 Z" />
  <!-- Palang atas kanan: sisi kiri tegak, sisi kanan miring -->
  <path class="green" d="M574 298 H709 L649 392 H574 Z" />

  <!-- Batang tengah, dipotong dua diagonal sejajar -->
  <path class="slate" d="M566 302 V470 L457 557 V399 Z" />
  <path class="green" d="M566 480 V609 L457 690 V567 Z" />
  <path class="slate" d="M566 619 V716 H457 V700 Z" />

  <!-- Kursor underscore, rata bawah dengan batang -->
  <rect class="green" x="602" y="690" width="165" height="26" rx="6" />
</svg>
