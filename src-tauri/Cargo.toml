[package]
name = "remote-app"
version = "0.1.0"
description = "Remote Access Desktop App (SSH/Telnet/Serial/FTP)"
authors = ["Diki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remote_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
russh = "0.62.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
tokio-util = { version = "0.7.12", features = ["compat"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio-serial = "5.4.4"
suppaftp = { version = "5.3", features = ["async", "async-rustls"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
webpki-roots = "0.22"
async-tls = "0.13"
portable-pty = "0.8"
zeroize = "1"

# Tuning build rilis (D-30): footprint kecil sesuai PRD §7.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

